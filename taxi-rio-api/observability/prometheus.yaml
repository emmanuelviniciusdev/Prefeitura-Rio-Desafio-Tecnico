global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rules only. Alertmanager is intentionally not configured.
rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # The API exposition includes worker metrics pulled from the worker process.
  - job_name: taxi-rio-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - taxi-rio-api:3000

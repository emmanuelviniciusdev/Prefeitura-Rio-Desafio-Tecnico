apiVersion: v1
kind: Service
metadata:
  name: taxi-rio-worker
  labels:
    app.kubernetes.io/name: taxi-rio-worker
    app.kubernetes.io/part-of: taxi-rio
    app.kubernetes.io/component: worker
    environment: dev
spec:
  selector:
    app.kubernetes.io/name: taxi-rio-worker
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxi-rio-worker
  labels:
    app.kubernetes.io/name: taxi-rio-worker
    app.kubernetes.io/part-of: taxi-rio
    app.kubernetes.io/component: worker
    environment: dev
spec:
  # KEDA owns this count. Omitting replicas keeps a later apply from
  # resetting the HorizontalPodAutoscaler back to 1.
  selector:
    matchLabels:
      app.kubernetes.io/name: taxi-rio-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxi-rio-worker
        app.kubernetes.io/part-of: taxi-rio
        app.kubernetes.io/component: worker
        environment: dev
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: taxi-rio-api:dev
          imagePullPolicy: Never
          command:
            - node
            - wait-for-dependencies.cjs
          envFrom:
            - configMapRef:
                name: taxi-rio
          env:
            - name: WAIT_FOR
              value: mongodb,rabbitmq
            - name: WAIT_TIMEOUT_SECONDS
              value: "300"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: taxi-rio-credentials
                  key: MONGODB_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: taxi-rio-credentials
                  key: RABBITMQ_URL
          # Node plus the Mongo and Rabbit drivers uses about 81Mi RSS at load time.
          # This init container is not the stress-tested worker process.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: wait-script
              mountPath: /app/wait-for-dependencies.cjs
              subPath: wait-for-dependencies.cjs
      containers:
        - name: taxi-rio-worker
          image: taxi-rio-api:dev
          imagePullPolicy: Never
          command:
            - node
            - dist/worker.js
          ports:
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: taxi-rio
          env:
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: taxi-rio
                  key: WORKER_NODE_OPTIONS
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: taxi-rio
                  key: WORKER_OTEL_SERVICE_NAME
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: taxi-rio-credentials
                  key: MONGODB_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: taxi-rio-credentials
                  key: RABBITMQ_URL
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: taxi-rio-credentials
                  key: JWT_PRIVATE_KEY
          # The worker has no HTTP app. /metrics is served after the process
          # context is up, which is the same signal the stress run scraped.
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Stress run 2026-10-10 with prefetch 10. CPU averaged 158m and
          # peaked at 221m of the 250m quota; RSS peaked at 64Mi of 128Mi.
          # Queue depth stayed at 0 through 200 it/s except a 37-message blip
          # at 150 it/s. Limit stays 250m / 128Mi, which fits the 96MB heap cap.
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: wait-script
          configMap:
            name: taxi-rio-wait

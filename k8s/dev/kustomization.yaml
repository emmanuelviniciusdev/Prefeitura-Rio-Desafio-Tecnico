apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taxi-rio
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - mysql.yaml
  - redis.yaml
  - mongodb.yaml
  - rabbitmq.yaml
  - api.yaml
  - worker.yaml
  - app.yaml
  - prometheus.yaml
  - jaeger.yaml
  - ingress.yaml
configMapGenerator:
  - name: taxi-rio-wait
    files:
      - wait-for-dependencies.cjs
  # Same bytes as taxi-rio-api/observability. Kustomize only loads files
  # inside this directory, so the dev cluster mounts this copy.
  - name: prometheus-config
    files:
      - prometheus.yml=observability/prometheus.yaml
      - alerts.yaml=observability/alerts.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: taxi-rio
    environment: dev

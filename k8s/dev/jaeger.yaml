apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: taxi-rio
    app.kubernetes.io/component: tracing
    environment: dev
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: taxi-rio
    app.kubernetes.io/component: tracing
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: taxi-rio
        app.kubernetes.io/component: tracing
        environment: dev
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.64.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          envFrom:
            - configMapRef:
                name: jaeger
          startupProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Peak: 44m avg / 98m max CPU, 152Mi RSS, flat across the run because
          # traces are held in memory (MEMORY_MAX_TRACES=10000). Limit stays
          # at the tested 500m / 256Mi ceiling.
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 256Mi

      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  taxi-rio-app:
    build:
      context: ./taxi-rio-app
      dockerfile: Dockerfile
    container_name: taxi-rio-app
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "5173:80"
    depends_on:
      taxi-rio-api:
        condition: service_healthy

  # One-shot load generator. Stays out of `docker compose up` unless the
  # loadtest profile is selected. Limits are part of the experiment conditions.
  k6:
    image: grafana/k6:1.3.0
    profiles:
      - loadtest
    user: "${K6_UID:-0}:${K6_GID:-0}"
    cpus: "${K6_CPUS:-1.0}"
    mem_limit: "${K6_MEMORY:-512m}"
    memswap_limit: "${K6_MEMORY:-512m}"
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      BASE_URL: http://taxi-rio-api:3000
      PROMETHEUS_URL: http://prometheus:9090
      SUMMARY_PATH: ${SUMMARY_PATH:-loadtest/results/stress-summary.json}
      STEPS: ${STEPS:-10,25,50,75,100,150,200}
      STEP_DURATION: ${STEP_DURATION:-1m}
      WARMUP_RATE: ${WARMUP_RATE:-5}
      PRE_ALLOCATED_VUS: ${PRE_ALLOCATED_VUS:-200}
      MAX_VUS: ${MAX_VUS:-800}
      K6_CPUS: ${K6_CPUS:-1.0}
      K6_MEMORY: ${K6_MEMORY:-512m}
    command: ["run", "${K6_SCRIPT:-loadtest/stress.js}"]
    depends_on:
      taxi-rio-api:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:

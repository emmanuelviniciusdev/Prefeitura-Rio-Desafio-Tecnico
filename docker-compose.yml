services:
  mysql:
    image: mysql:8.4
    container_name: taxi-rio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taxi_rio
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: "1.0"
    mem_limit: 1024m
    memswap_limit: 1024m

  redis:
    image: redis:7-alpine
    container_name: taxi-rio-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    cpus: "0.25"
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: taxi-rio-mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    cpus: "0.5"
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: taxi_rio
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "admin",
          "--password",
          "admin",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: taxi-rio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: "0.75"
    mem_limit: 256m
    memswap_limit: 256m

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: taxi-rio-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./taxi-rio-api/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./taxi-rio-api/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: taxi-rio-jaeger
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "10000"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  taxi-rio-api:
    build:
      context: ./taxi-rio-api
      dockerfile: Dockerfile
    container_name: taxi-rio-api
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 256m
    memswap_limit: 256m

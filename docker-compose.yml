      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      RABBITMQ_PREFETCH: "10"
      OTEL_SERVICE_NAME: taxi-rio-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      METRICS_PORT: "9464"

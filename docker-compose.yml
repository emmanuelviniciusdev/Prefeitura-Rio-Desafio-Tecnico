      REDIS_PORT: "6379"
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/taxi_rio?authSource=admin
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      OTEL_SERVICE_NAME: taxi-rio-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      WORKER_METRICS_URL: http://taxi-rio-worker:9464/metrics
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  taxi-rio-worker:
    build:
      context: ./taxi-rio-api
      dockerfile: Dockerfile
    container_name: taxi-rio-worker
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    memswap_limit: 128m
    command: ["node", "dist/worker.js"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=96"
